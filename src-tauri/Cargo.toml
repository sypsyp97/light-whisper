[package]
name = "light-whisper"
version = "1.8.2"
description = "轻语 - 本地与云端语音转文字桌面应用"
authors = ["sun"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "light_whisper_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"


serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }


tokio = { version = "1", features = ["rt", "io-util", "sync", "time", "process", "fs", "macros", "net"] }


dirs = "6"



log = "0.4"


base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
webbrowser = "1"

ring = "0.17"
pinyin = { version = "0.11", default-features = false, features = ["plain"] }


cpal = "0.15"


reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"], default-features = false }
rustls = { version = "0.23", default-features = false }
eventsource-stream = "0.2"
tokio-stream = "0.1"


tauri-plugin-keyring = "0.1"
keyring = "3.6.3"


thiserror = "2"


rubato = "0.16"


parking_lot = "0.12"
arc-swap = "1.7"


hound = "3.5"


rusqlite = { version = "0.32", features = ["bundled"] }


tar = "0.4"
xz2 = "0.1"
zip = "2"


rfd = "0.15"
scraper = { version = "0.27", default-features = false }


[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Media_Audio", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Security_Authorization", "Win32_System_SystemServices"] }
uiautomation = { version = "0.24", features = ["clipboard"] }
xcap = { version = "0.9", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["hooks"] }
tauri = { version = "2", features = ["test"] }
ts-rs = { version = "=12.0.1" }
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
