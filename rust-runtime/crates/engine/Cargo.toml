[package]
name = "light-whisper-engine"
version = "1.8.2"
edition = "2024"
publish = false

[[bin]]
name = "engine"
path = "src/main.rs"

[dependencies]
light-whisper-native-asr = {path="../native-asr"}
light-whisper-vad = {path="../vad"}
base64 = "0.22"
libloading = "0.8.9"
serde_json = {version="1",features=["arbitrary_precision"]}
sha2 = "0.10"
tempfile = "3"
reqwest = {version="0.12",default-features=false,features=["blocking","rustls-tls"]}
light-whisper-reuse = {path="../reuse"}
