name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal:
    name: Application formal contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version

      - name: Test Git hooks and installer privacy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nsis p7zip-full
          command -v makensis
          command -v 7z
          python -m unittest scripts.test_git_privacy scripts.test_release_privacy

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - name: Check inventory, TLA models, Lean proofs and counterexamples
        shell: bash
        run: |
          python scripts/test_check_formal.py
          python scripts/test_async_ownership_traces.py
          python scripts/test_async_output_wiring.py
          curl -fsSL --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$RUNNER_TEMP/tla2tools.jar"
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  '"$RUNNER_TEMP/tla2tools.jar" | sha256sum --check
          curl -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo '47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  '"$RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          python scripts/check_formal.py \
            --tlc-jar "$RUNNER_TEMP/tla2tools.jar" \
            --lean "$RUNNER_TEMP/lean-4.34.1-linux/bin/lean" \
            --logs "$RUNNER_TEMP/formal-results"

      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formal-contract-results
          path: |
            ${{ runner.temp }}/formal-results/**/tlc.log
            ${{ runner.temp }}/formal-results/**/result.json
            ${{ runner.temp }}/formal-results/summary.json
            ${{ runner.temp }}/formal-results/lean.log
          if-no-files-found: ignore
          retention-days: 14

  verus:
    name: Verus implementation proofs
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version

      - name: Verify production Rust contracts
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          python scripts/test_check_verus.py
          $tools = Join-Path $env:RUNNER_TEMP 'tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $archive = Join-Path $tools 'verus.zip'
          if (-not (Test-Path -LiteralPath $archive)) {
            Invoke-WebRequest -Uri 'https://github.com/verus-lang/verus/releases/download/release/0.2026.10.18.7d82994/verus-0.2026.10.18.7d82994-x86-win.zip' -OutFile $archive
          }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '82b9558a3c4fa77673700507c066c711535d130c2789dcfcec30878168db20ec') {
            throw 'Verus archive SHA256 mismatch'
          }
          $release = Join-Path $tools 'verus-release'
          Expand-Archive -LiteralPath $archive -DestinationPath $release -Force
          $env:RUSTUP_HOME = Join-Path $env:RUNNER_TEMP 'tools/rustup'
          $env:CARGO_HOME = Join-Path $env:RUNNER_TEMP 'tools/cargo'
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          python scripts/check_verus.py --verus (Join-Path $release 'verus-x86-win/verus.exe') --logs (Join-Path $env:RUNNER_TEMP 'verus-results')

      - name: Upload Verus evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verus-contract-results
          path: ${{ runner.temp }}/verus-results/**
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if (-not $env:BASE_SHA -or $env:BASE_SHA -match '^0+$') {
            git show --check --format= $env:HEAD_SHA
          } else {
            git diff --check "$env:BASE_SHA...$env:HEAD_SHA"
          }

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.28.2
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        run: pnpm check

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Verify tracked files are unchanged
        run: git diff --exit-code

  cli:
    name: CLI contracts
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.11.30

      - name: Install CLI Python dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          uv lock --check
          uv sync --frozen

      - name: Set up CLI Rust
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0
          rustc --version

      - name: Cache CLI Rust dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            !src-tauri/target/**/incremental/**
          key: rust-${{ runner.os }}-1.93.0-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/src/**/*.rs', 'src-tauri/build.rs', 'src-tauri/Cargo.toml', 'src-tauri/tauri.conf.json') }}
          restore-keys: |
            rust-${{ runner.os }}-1.93.0-${{ hashFiles('src-tauri/Cargo.lock') }}-

      - name: Set up Java for CLI models
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - name: Run CLI unit contracts
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          uv run --no-sync python -m unittest discover -s scripts -p "test_*cli*.py"
          uv run --no-sync python -m unittest discover -s formal/agent-api-measurements/entrypoint -p "test_*.py" -v
          uv run --no-sync python -m unittest discover -s formal/agent-api-host/admission -p test_runner.py
          uv run --no-sync python -m unittest discover -s formal/cli/json-numbers -p test_runner.py
          uv run --no-sync python scripts/test_release_ci.py
          uv run --no-sync python scripts/test_ci_fail_fast.py

      - name: Build and verify standalone CLI
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $receipts = Join-Path $env:RUNNER_TEMP 'cli-receipts/package'
          New-Item -ItemType Directory -Force -Path $receipts | Out-Null
          uv run --no-sync python scripts/build_cli.py
          $verification = uv run --no-sync python scripts/build_cli.py --verify
          $verification | Set-Content -LiteralPath (Join-Path $receipts 'verification.json')
          $env:LIGHT_WHISPER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'cli-doctor-state'
          $doctor = & ./src-tauri/resources/light-whisper-cli.exe doctor
          $doctor | Set-Content -LiteralPath (Join-Path $receipts 'doctor.json')
          if (($doctor | ConvertFrom-Json).success -ne $true) {
            throw 'Packaged CLI doctor failed'
          }

      - name: Build locked native engine
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:LW_ORT_SDK = uv run --no-sync python -c "import sys; sys.path.insert(0,'scripts'); from build_engine import prepare_ort; print(prepare_ort())"
          $env:LW_KALDI_SDK = uv run --no-sync python -c "from importlib.metadata import distribution; print(distribution('kaldi-native-fbank').locate_file('kaldi_native_fbank'))"
          cargo build --manifest-path rust-runtime/Cargo.toml --package light-whisper-engine --bin engine --release --locked
          $nativeTests = Join-Path $PWD "rust-runtime/target/debug/deps"
          New-Item -ItemType Directory -Force $nativeTests | Out-Null
          Copy-Item (Join-Path $env:LW_ORT_SDK "runtimes/win-x64/native/onnxruntime.dll") $nativeTests
          Copy-Item (Join-Path $env:LW_KALDI_SDK "lib/kaldi-native-fbank-core.dll") $nativeTests
          cargo test --manifest-path rust-runtime/Cargo.toml --workspace --locked

      - name: Run native CLI contracts
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --manifest-path formal/agent-api-security/Cargo.toml --locked -j2 -- --test-threads=1
          cargo test --manifest-path formal/agent-api-transport/Cargo.toml --locked -j2 -- --test-threads=1
          cargo build --manifest-path src-tauri/Cargo.toml --bin light-whisper --locked -j2
          cargo build --manifest-path formal/agent-api-host/native-fixture/Cargo.toml --bin agent-host-native-fixture --locked -j2 --target-dir src-tauri/target

      - name: Run native headless host contracts
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          uv run --no-sync python formal/agent-api-host/run.py --app-exe src-tauri/target/debug/light-whisper.exe --fixture-exe src-tauri/target/debug/agent-host-native-fixture.exe --evidence (Join-Path $env:RUNNER_TEMP 'cli-receipts/native-host')

      - name: Run complete CLI formal matrices
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $java = Join-Path $env:JAVA_HOME 'bin/java.exe'
          $jar = Join-Path $env:RUNNER_TEMP 'tla2tools.jar'
          Invoke-WebRequest -Uri 'https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar' -OutFile $jar
          if ((Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLowerInvariant() -ne '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88') {
            throw 'TLA+ JAR SHA256 mismatch'
          }
          $receipts = Join-Path $env:RUNNER_TEMP 'cli-receipts/models'
          uv run --no-sync python formal/cli/run_models.py --jar $jar --output (Join-Path $receipts 'cli')
          uv run --no-sync python formal/cli/run_configuration_models.py --jar $jar --output (Join-Path $receipts 'configuration')
          uv run --no-sync python formal/cli/run_session_models.py --jar $jar --output (Join-Path $receipts 'session')
          uv run --no-sync python formal/cli/run_target_models.py --jar $jar --output (Join-Path $receipts 'target')
          uv run --no-sync python formal/cli/run_bootstrap_models.py --jar $jar --output (Join-Path $receipts 'bootstrap')
          uv run --no-sync python formal/cli/run_native_thread_models.py --java $java --jar $jar --output (Join-Path $receipts 'native-thread')
          uv run --no-sync python formal/cli/CommandSurfaceCheck.py --java $java --jar $jar --output (Join-Path $receipts 'command-surface')
          uv run --no-sync python formal/cli/json-numbers/check_model.py --java $java --jar $jar --output (Join-Path $receipts 'json-numbers')
          uv run --no-sync python formal/cli-packaging/run_models.py --java $java --jar $jar --output (Join-Path $receipts 'packaging')
          uv run --no-sync python formal/agent-api-security/check_model.py --jar $jar --output (Join-Path $receipts 'private-files')
          uv run --no-sync python formal/agent-api-transport/check_model.py --jar $jar --output (Join-Path $receipts 'transport')
          uv run --no-sync python formal/agent-api-app/check_model.py --jar $jar --output (Join-Path $receipts 'app-query')
          uv run --no-sync python formal/agent-api-host/check_model.py --java $java --jar $jar --output (Join-Path $receipts 'native-host')
          uv run --no-sync python formal/agent-api-host/admission/check_model.py --java $java --jar $jar --output (Join-Path $receipts 'native-admission')
          uv run --no-sync python formal/cli-ci/check_model.py --java $java --jar $jar --output (Join-Path $receipts 'ci-gates')
          uv run --no-sync python formal/rust-runtime/check_models.py --java $java --jar $jar --output (Join-Path $receipts 'rust-runtime')
          uv run --no-sync python formal/asr-subscription-bootstrap/verify.py --java $java --jar $jar --output (Join-Path $receipts 'asr-subscription-bootstrap')
          pwsh -NoProfile -File formal/asr-agent-settings/run_checks.ps1 -Java $java -Jar $jar -OutputDirectory (Join-Path $receipts 'asr-agent-settings')

      - name: Verify CLI checks preserved tracked files
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git diff --exit-code

      - name: Upload CLI contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-contract-results
          path: |
            ${{ runner.temp }}/cli-receipts/**/*.json
            ${{ runner.temp }}/cli-receipts/**/*.log
          if-no-files-found: ignore
          retention-days: 14

  python:
    name: Python
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.11.30

      - name: Verify Python lockfile
        run: uv lock --check

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Compile and test Python sources
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv run --no-sync python -m compileall -q scripts src-tauri/resources
          uv run --no-sync python -m unittest discover -s src-tauri/resources -p "test_*.py"
          uv run --no-sync python scripts/test_build_engine_atomicity.py
          uv run --no-sync python scripts/test_cpu_cuda_backends.py
          uv run --no-sync python scripts/test_native_source_checkout.py
          uv run --no-sync python scripts/test_single_native_backend.py
          uv run --no-sync python scripts/test_engine_dependency_pruning.py
          uv run --no-sync python scripts/test_engine_archive_layout.py
          uv run --no-sync python scripts/test_release_ci.py
          uv run --no-sync python scripts/test_ci_fail_fast.py
          uv run --no-sync python scripts/test_verus_ci.py

      - name: Verify tracked files are unchanged
        run: git diff --exit-code

  rust:
    name: Rust
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup default 1.93.0
          rustc --version

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            !src-tauri/target/**/incremental/**
          key: rust-${{ runner.os }}-1.93.0-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/src/**/*.rs', 'src-tauri/build.rs', 'src-tauri/Cargo.toml', 'src-tauri/tauri.conf.json') }}
          restore-keys: |
            rust-${{ runner.os }}-1.93.0-${{ hashFiles('src-tauri/Cargo.lock') }}-

      - name: Check Rust formatting and lints
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked --
          --skip services::qwen_hotword_service::tests::hotword_correction_p95_stays_below_one_millisecond

      - name: Measure hotword correction performance
        continue-on-error: true
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
          services::qwen_hotword_service::tests::hotword_correction_p95_stays_below_one_millisecond --
          --exact --nocapture --test-threads=1

      - name: Verify tracked files are unchanged
        run: git diff --exit-code
