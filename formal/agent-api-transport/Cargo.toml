[package]
name = "agent-api-transport-verification"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rand = "=0.8.5"
ring = "=0.17.14"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_Networking_WinSock"] }

[[bin]]
name = "agent-transport-probe"
path = "src/bin/agent_transport_probe.rs"
