[run]
branch = True
parallel = True
relative_files = True
include =
    */scripts/light_whisper_cli.py
    */scripts/build_cli.py
    */src-tauri/resources/r2t2_native.py
    */src-tauri/resources/qwen3_native.py

[paths]
scripts =
    scripts
    */source/scripts

[report]
include =
    */scripts/light_whisper_cli.py
    */scripts/build_cli.py
    */src-tauri/resources/r2t2_native.py
    */src-tauri/resources/qwen3_native.py
show_missing = True

[json]
pretty_print = True
